name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown:
    name: Markdown checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changed .md files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" -- '*.md' > changed.txt
          else
            git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" -- '*.md' > changed.txt
          fi
          FILES=$(tr '\n' ' ' < changed.txt)
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"
          echo "Changed: ${FILES:-<none>}"
      - name: markdownlint-cli2
        if: steps.changed.outputs.files != ''
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: ${{ steps.changed.outputs.files }}
      - name: Check internal links / file existence
        # PR: only files changed in this PR (pre-existing broken links on main
        # must not block unrelated PRs). Push to main: whole repo.
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: python3 .github/scripts/check-links.py $FILES
      - name: Whole-repo scan (push to main)
        if: github.event_name == 'push'
        run: python3 .github/scripts/check-links.py

  external-links:
    name: External links (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee broken link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --retry-wait-time 5
            --accept 200,204,206,301,302
            "**/*.md"
          fail: false
